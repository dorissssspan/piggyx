<script>
  const tags = ['全部'];
  SHARE_ARTICLES.forEach(a => { if (!tags.includes(a.tag)) tags.push(a.tag); });

  const bar = document.getElementById('filter-bar');
  const wrap = document.getElementById('note-cards');
  // 从 URL 恢复标签（从文章页带 ?tag= 回来时落到原标签，而非“全部”）
  const urlTag = new URLSearchParams(location.search).get('tag');
  let current = (urlTag && tags.includes(urlTag)) ? urlTag : '全部';

  function render() {
    bar.innerHTML = '';
    tags.forEach(t => {
      const b = document.createElement('button');
      b.className = 'filter-btn' + (t === current ? ' active' : '');
      b.textContent = t === '全部' ? '全部 (' + SHARE_ARTICLES.length + ')' : t;
      b.onclick = () => { current = t; render(); };
      bar.appendChild(b);
    });

    wrap.innerHTML = '';
    SHARE_ARTICLES.filter(a => current === '全部' || a.tag === current).forEach(a => {
      const card = document.createElement('a');
      card.className = 'card';
      // 把当前标签透传给文章页，方便返回时回到原筛选
      card.href = 'share-art.html?id=' + a.id + (current !== '全部' ? '&from=' + encodeURIComponent(current) : '');
      card.innerHTML =
        '<div class="card-meta"><span class="tag ' + a.tagClass + '">' + a.tag + '</span>' +
        '<span class="date">' + a.date + '</span></div>' +
        '<h3>' + a.title + '</h3>' +
        '<p class="summary">' + a.summary + '</p>' +
        '<span class="read-more">read more →</span>';
      wrap.appendChild(card);
    });
  }
  render();
</script>
</body>
