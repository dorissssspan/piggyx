<script src="js/articles.js"></script>
<script>
  const tags = ['全部'];
  ARTICLES.forEach(a => { if (!tags.includes(a.tag)) tags.push(a.tag); });

  const bar = document.getElementById('filter-bar');
  const wrap = document.getElementById('note-cards');
  const searchInput = document.getElementById('search-input');
  const searchClear = document.getElementById('search-clear');
  const searchCount = document.getElementById('search-count');
  // 从 URL 恢复标签（从文章页带 ?tag= 回来时落到原标签，而非“全部”）
  const urlParams = new URLSearchParams(location.search);
  const urlTag = urlParams.get('tag');
  let current = (urlTag && tags.includes(urlTag)) ? urlTag : '全部';
  let keyword = urlParams.get('kw') || '';

  // 模糊匹配：标题 / 简介 / 标签 / 正文 任一包含关键词
  function matchKW(a, kw) {
    if (!kw) return true;
    const hay = (a.title + ' ' + a.summary + ' ' + a.tag + ' ' + a.content).toLowerCase();
    return hay.includes(kw);
  }

  function render() {
    bar.innerHTML = '';
    tags.forEach(t => {
      const b = document.createElement('button');
      b.className = 'filter-btn' + (t === current ? ' active' : '');
      b.textContent = t === '全部' ? '全部 (' + ARTICLES.length + ')' : t;
      b.onclick = () => { current = t; render(); };
      bar.appendChild(b);
    });

    const list = ARTICLES.filter(a =>
      (current === '全部' || a.tag === current) && matchKW(a, keyword)
    );

    searchCount.textContent = keyword
      ? '“' + keyword + '” 找到 ' + list.length + ' 篇'
      : '';

    wrap.innerHTML = '';
    if (!list.length) {
      wrap.innerHTML = '<p class="empty-tip">没有匹配的文章，换个关键词试试～</p>';
      return;
    }
    list.forEach(a => {
      const card = document.createElement('a');
      card.className = 'card';
      // 把当前标签（及关键词）透传给文章页，方便返回时回到原筛选
      let href = 'article.html?id=' + a.id;
      if (current !== '全部') href += '&from=' + encodeURIComponent(current);
      if (keyword) href += (current !== '全部' ? '' : '&') + 'kw=' + encodeURIComponent(keyword);
      card.href = href;
      card.innerHTML =
        '<div class="card-meta"><span class="tag ' + a.tagClass + '">' + a.tag + '</span>' +
        '<span class="date">' + a.date + '</span></div>' +
        '<h3>' + a.title + '</h3>' +
        '<p class="summary">' + a.summary + '</p>' +
        '<span class="read-more">read more →</span>';
      wrap.appendChild(card);
    });
  }

  function applySearch() {
    keyword = searchInput.value.trim().toLowerCase();
    searchClear.style.display = keyword ? 'block' : 'none';
    render();
  }
  searchInput.addEventListener('input', applySearch);
  searchClear.addEventListener('click', () => {
    searchInput.value = '';
    searchInput.focus();
    applySearch();
  });

  // 从文章页带 kw 回来时，回填搜索框并应用筛选
  if (keyword) {
    searchInput.value = keyword;
    searchClear.style.display = 'block';
  }

  render();
</script>
